<canvas id="c"></canvas>

// ── Constants ───────────────────────────────────────────────────────────────
const LW = 320, LH = 568;           // logical canvas size
const GRAVITY       = 1400;
const FLAP_VEL      = -420;
const MAX_FALL      = 700;
const PIPE_W        = 52;
const PIPE_GAP      = 145;
const PIPE_SPEED    = 140;
const PIPE_INTERVAL = 1.6;
const GROUND_H      = 60;
const BIRD_R        = 20;           // collision radius (px logical)
const BIRD_DISPLAY  = 36;           // draw radius (visual circle size)

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let dpr = 1, scaleX = 1, scaleY = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const ratio = LH / LW;
  let cssW = window.innerWidth;
  let cssH = window.innerHeight;
  if (cssH / cssW > ratio) { cssH = Math.floor(cssW * ratio); }
  else                     { cssW = Math.floor(cssH / ratio); }
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  scaleX = canvas.width  / LW;
  scaleY = canvas.height / LH;
}
window.addEventListener('resize', resize);
resize();

// ── Game state ────────────────────────────────────────────────────────────────
let state = 'waiting'; // 'waiting' | 'playing' | 'dead'
let score = 0;
let best  = parseInt(localStorage.getItem('flappy_best') || '0');
let deathTime = 0;
let idleT = 0;

const bird = { x: 80, y: LH / 2, vy: 0, angle: 0 };
let pipes = [];
let pipeTimer = 0;

// ── Input ─────────────────────────────────────────────────────────────────────
function flap() {
  if (state === 'waiting') {
    state = 'playing';
    bird.vy = FLAP_VEL;
  } else if (state === 'playing') {
    bird.vy = FLAP_VEL;
  } else if (state === 'dead' && Date.now() - deathTime > 500) {
    resetGame();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); flap();
}, { passive: false });
canvas.addEventListener('mousedown', () => flap());

// ── Collision helper ──────────────────────────────────────────────────────────
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

// ── Game logic ────────────────────────────────────────────────────────────────
function spawnPipe() {
  const minTop = 60, maxTop = LH - GROUND_H - PIPE_GAP - 60;
  const gapTop = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: LW + PIPE_W, gapTop, gapBottom: gapTop + PIPE_GAP, scored: false });
}

function resetGame() {
  bird.y  = LH / 2;
  bird.vy = 0;
  bird.angle = 0;
  pipes = [];
  pipeTimer = 0;
  score = 0;
  idleT = 0;
  state = 'waiting';
}

function update(dt) {
  if (state === 'waiting') {
    idleT += dt;
    bird.y = LH / 2 + Math.sin(idleT * 2.5) * 8;
    return;
  }
  if (state === 'dead') return;

  // Physics
  bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
  bird.y += bird.vy * dt;
  bird.angle = Math.max(-0.45, Math.min(Math.PI / 2, bird.vy / 900));

  // Pipes
  pipeTimer += dt;
  if (pipeTimer >= PIPE_INTERVAL) { spawnPipe(); pipeTimer = 0; }
  for (const p of pipes) {
    p.x -= PIPE_SPEED * dt;
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      if (score > best) { best = score; localStorage.setItem('flappy_best', best); }
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > 0);

  // Collisions
  if (bird.y + BIRD_R >= LH - GROUND_H || bird.y - BIRD_R <= 0) {
    die();
    return;
  }
  for (const p of pipes) {
    if (circleRect(bird.x, bird.y, BIRD_R, p.x, 0, PIPE_W, p.gapTop) ||
        circleRect(bird.x, bird.y, BIRD_R, p.x, p.gapBottom, PIPE_W, LH - GROUND_H - p.gapBottom)) {
      die();
      return;
    }
  }
}

function die() {
  state = 'dead';
  deathTime = Date.now();
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawBg() {
  const grad = ctx.createLinearGradient(0, 0, 0, LH - GROUND_H);
  grad.addColorStop(0,   '#4ec0ca');
  grad.addColorStop(1,   '#78d6e0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, LW, LH - GROUND_H);

  // Ground
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, LH - GROUND_H, LW, GROUND_H);
  ctx.fillStyle = '#5d8a3c';
  ctx.fillRect(0, LH - GROUND_H, LW, 8);
}

function drawPipes() {
  for (const p of pipes) {
    const capH = 22, capExtra = 6;

    // Top pipe
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(p.x, 0, PIPE_W, p.gapTop - capH);
    ctx.fillStyle = '#388e3c';
    ctx.fillRect(p.x - capExtra / 2, p.gapTop - capH, PIPE_W + capExtra, capH);

    // Bottom pipe
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(p.x, p.gapBottom + capH, PIPE_W, LH - GROUND_H - p.gapBottom - capH);
    ctx.fillStyle = '#388e3c';
    ctx.fillRect(p.x - capExtra / 2, p.gapBottom, PIPE_W + capExtra, capH);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.angle);

  const r = BIRD_DISPLAY;

  if (friendImg.complete && friendImg.naturalWidth > 0) {
    // Clip to circle and draw friend photo
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(friendImg, -r, -r, r * 2, r * 2);

    // White border
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    // Fallback: yellow circle while image loads
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#f5e642';
    ctx.fill();
    ctx.strokeStyle = '#e0b800';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  ctx.restore();
}

function drawScore() {
  ctx.save();
  ctx.font = 'bold 40px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'white';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  const txt = String(score);
  ctx.strokeText(txt, LW / 2, 60);
  ctx.fillText(txt,   LW / 2, 60);
  ctx.restore();
}

function drawOverlay(title, sub1, sub2) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, LW, LH);

  ctx.textAlign = 'center';

  ctx.font = 'bold 36px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 3;
  ctx.strokeText(title, LW / 2, LH / 2 - 40);
  ctx.fillText(title,   LW / 2, LH / 2 - 40);

  ctx.font = '22px sans-serif';
  ctx.fillStyle = '#ffe';
  ctx.fillText(sub1, LW / 2, LH / 2 + 10);
  ctx.fillText(sub2, LW / 2, LH / 2 + 42);
  ctx.restore();
}

function draw() {
  ctx.save();
  ctx.scale(scaleX, scaleY);

  drawBg();
  drawPipes();
  drawBird();
  drawScore();

  if (state === 'waiting') {
    drawOverlay('Flappy Bird', 'Toque para começar', '');
  } else if (state === 'dead') {
    drawOverlay(
      'Fim de jogo!',
      'Pontos: ' + score + '  |  Recorde: ' + best,
      'Toque para jogar de novo'
    );
  }

  ctx.restore();
}

// ── Loop ──────────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
